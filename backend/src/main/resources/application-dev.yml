spring:
  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/quyen_auto?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

firebase:
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

logging:
  level:
    com.quyenauto: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
