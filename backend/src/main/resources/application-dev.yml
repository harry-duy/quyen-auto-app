spring:
  datasource:
    url: jdbc:mysql://localhost:3306/quyen_auto?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password:

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

logging:
  level:
    com.quyenauto: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
