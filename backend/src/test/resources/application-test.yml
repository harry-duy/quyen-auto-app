spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: localhost

app:
  jwt:
    secret: test-jwt-secret-key-must-be-at-least-32-bytes-long-for-hs256
    access-token-expiration: 3600000
    refresh-token-expiration: 86400000
  cloudinary:
    cloud-name: test
    api-key: test
    api-secret: test
  cors:
    allowed-origins: http://localhost:3000
