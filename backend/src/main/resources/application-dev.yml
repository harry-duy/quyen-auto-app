spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/quyen_auto?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:quyen_user}
    password: ${DB_PASSWORD:QuyenAuto123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  flyway:
    clean-on-validate-error: true

  jpa:
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password:

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    secret: dev-only-jwt-secret-key-do-not-use-in-production-min32chars

logging:
  level:
    com.quyenauto: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
